name: Testes E2E

on: [push, pull_request]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Preparar variáveis
        run: cp .env.example .env
      - name: Subir ambiente
        run: docker compose up --build --wait web
      - name: Executar Cypress
        run: docker compose run --rm --no-deps e2e
      - name: Coletar logs em caso de falha
        if: failure()
        run: docker compose logs web db
      - name: Encerrar ambiente
        if: always()
        run: docker compose --profile test down -v
